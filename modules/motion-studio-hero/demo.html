<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Motion Studio Hero Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../shared/css/global-tokens.css">
    <link rel="stylesheet" href="../../css/tokens.css">
    <link rel="stylesheet" href="motion-studio-hero.css">
    <style>
      :root {
        --ms-blue: #2093d0;
        --ms-pale-blue: #e9f7fd;

      *,

      mountMotionStudioHero();
    </script>
